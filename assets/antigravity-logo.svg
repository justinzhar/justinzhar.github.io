<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" /> <!-- Blue -->
      <stop offset="35%" style="stop-color:#10B981;stop-opacity:1" /> <!-- Green -->
      <stop offset="65%" style="stop-color:#F59E0B;stop-opacity:1" /> <!-- Yellow/Orange -->
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" /> <!-- Red -->
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M20 75 L 50 25 L 80 75" stroke="url(#rainbowGradient)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
